<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .float { animation: float 3s ease-in-out infinite; }
  .cardshadow { animation: shade 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  @keyframes shade { 0%,100% { opacity:.16; transform: scale(1) } 50% { opacity:.07; transform: scale(.75) } }
  .wave { opacity: 0; animation: wave 1.8s ease-out infinite; }
  @keyframes wave { 0% { opacity: 0 } 25% { opacity: .95 } 70%,100% { opacity: 0 } }
  .blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 0%,60% { opacity: 1 } 60.1%,100% { opacity: .25 } }
  .press { animation: press 4.5s ease-in-out infinite; }
  @keyframes press { 0%,8% { transform: translateY(0) } 12%,30% { transform: translateY(4px) } 34%,100% { transform: translateY(0) } }
  @keyframes spin0 { 0% { opacity: .12 } 0.00% { opacity: 1 } 1.90% { opacity: .12 } 5.70% { opacity: 1 } 7.60% { opacity: .12 } 11.40% { opacity: 1 } 13.99% { opacity: .12 } 19.17% { opacity: 1 } 22.63% { opacity: .12 } 32.82% { opacity: 1 } 40.07% { opacity: .12 } 100% { opacity: .12 } }
  .spin0 { opacity:.12; animation: spin0 5.79s steps(1) infinite; }
  @keyframes spin1 { 0% { opacity: .12 } 1.90% { opacity: 1 } 3.80% { opacity: .12 } 7.60% { opacity: 1 } 9.50% { opacity: .12 } 13.99% { opacity: 1 } 16.58% { opacity: .12 } 22.63% { opacity: 1 } 27.12% { opacity: .12 } 40.07% { opacity: 1 } 49.57% { opacity: .12 } 100% { opacity: .12 } }
  .spin1 { opacity:.12; animation: spin1 5.79s steps(1) infinite; }
  @keyframes spin2 { 0% { opacity: .12 } 3.80% { opacity: 1 } 5.70% { opacity: .12 } 9.50% { opacity: 1 } 11.40% { opacity: .12 } 16.58% { opacity: 1 } 19.17% { opacity: .12 } 27.12% { opacity: 1 } 32.82% { opacity: .12 } 49.57% { opacity: 1 } 91.36% { opacity: .12 } 100% { opacity: .12 } }
  .spin2 { opacity:.12; animation: spin2 5.79s steps(1) infinite; }
  @keyframes win { 0%,62.00% { opacity:0; transform: scale(.6) } 65.00% { opacity:.9; transform: scale(1) } 91.36% { opacity:0; transform: scale(1.9) } 100% { opacity:0 } }
  .win { animation: win 5.79s ease-out infinite; transform-box: fill-box; transform-origin: center; }
</style>
<defs><filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5"/></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5B5878" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF9FF"/><stop offset="1" stop-color="#F1F6FA"/></linearGradient></defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
<rect x="30" y="26" width="360" height="278" rx="22" fill="#fff" opacity=".7"/><circle cx="64" cy="228" r="15" fill="#5B5878"/><text x="64" y="233.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="90" y="234" font-size="21" font-weight="700" fill="#3E3A4F">tap your card</text><text x="52" y="264" font-size="13.5" fill="#8B87A3">any mifare card works. new cards start with 100</text><text x="52" y="283" font-size="13.5" fill="#8B87A3">points, then the session runs without the card.</text><g filter="url(#soft)"><polygon points="210.0,70.0 339.9,145.0 227.3,210.0 97.4,135.0" fill="#ECE7FA" /><g><polygon points="153.7,145.5 205.7,175.5 205.7,171.5 153.7,141.5" fill="#A9CDF2"/><polygon points="275.0,135.5 205.7,175.5 205.7,171.5 275.0,131.5" fill="#8DB9E9"/><polygon points="223.0,101.5 275.0,131.5 205.7,171.5 153.7,141.5" fill="#CBE2F9"/></g><g transform="matrix(0.8660,0.5,-0.8660,0.5,223.0,101.3)"><rect x="9" y="12" width="42" height="56" rx="10" fill="none" stroke="#fff" stroke-width="2.4" opacity=".9"/><rect x="15" y="18" width="30" height="44" rx="8" fill="none" stroke="#fff" stroke-width="1.6" opacity=".6"/></g><ellipse cx="214.3" cy="136.0" rx="4" ry="2" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="rx" from="4" to="46" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="ry" from="2" to="23" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" from=".9" to="0" dur="2.2s" begin="0s" repeatCount="indefinite"/></ellipse><ellipse cx="214.3" cy="136.0" rx="4" ry="2" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="rx" from="4" to="46" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="ry" from="2" to="23" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" from=".9" to="0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></ellipse><ellipse cx="214.3" cy="136.1" rx="22.0" ry="11.0" fill="#3E3B54" opacity=".12" class="cardshadow"/><g class="float"><g><polygon points="173.6,119.0 206.5,138.0 206.5,135.0 173.6,116.0" fill="#FFC6A3"/><polygon points="255.0,110.0 206.5,138.0 206.5,135.0 255.0,107.0" fill="#F5AC85"/><polygon points="222.1,88.0 255.0,107.0 206.5,135.0 173.6,116.0" fill="#FFDCC4"/></g><g transform="matrix(0.8660,0.5,-0.8660,0.5,222.1,87.8)"><rect x="7" y="9" width="10" height="8" rx="2" fill="#F7D37B"/><rect x="7" y="36" width="24" height="3" rx="1.5" fill="#fff" opacity=".8"/><rect x="7" y="43" width="16" height="3" rx="1.5" fill="#fff" opacity=".8"/></g></g></g><rect x="415" y="26" width="360" height="278" rx="22" fill="#fff" opacity=".7"/><circle cx="449" cy="228" r="15" fill="#5B5878"/><text x="449" y="233.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="475" y="234" font-size="21" font-weight="700" fill="#3E3A4F">pick a colour</text><text x="437" y="264" font-size="13.5" fill="#8B87A3">press black, red or green to bet 10 points. hold</text><text x="437" y="283" font-size="13.5" fill="#8B87A3">black to change the stake, hold red to log out.</text><g filter="url(#soft)"><polygon points="595.0,70.0 724.9,145.0 612.3,210.0 482.4,135.0" fill="#ECE7FA" /><g><polygon points="544.8,115.0 562.1,125.0 562.1,119.0 544.8,109.0" fill="#ECEAF3"/><polygon points="579.4,115.0 562.1,125.0 562.1,119.0 579.4,109.0" fill="#DDDAE8"/><polygon points="562.1,99.0 579.4,109.0 562.1,119.0 544.8,109.0" fill="#FFFFFF"/></g><g class="press" style="animation-delay:0s"><polygon points="551.7,109.0 562.1,115.0 562.1,108.0 551.7,102.0" fill="#A9B4C9"/><polygon points="572.5,109.0 562.1,115.0 562.1,108.0 572.5,102.0" fill="#8D9AB4"/><polygon points="562.1,96.0 572.5,102.0 562.1,108.0 551.7,102.0" fill="#C9D1E0"/></g><g><polygon points="581.1,136.0 598.5,146.0 598.5,140.0 581.1,130.0" fill="#ECEAF3"/><polygon points="615.8,136.0 598.5,146.0 598.5,140.0 615.8,130.0" fill="#DDDAE8"/><polygon points="598.5,120.0 615.8,130.0 598.5,140.0 581.1,130.0" fill="#FFFFFF"/></g><g class="press" style="animation-delay:1.5s"><polygon points="588.1,130.0 598.5,136.0 598.5,129.0 588.1,123.0" fill="#F3A39D"/><polygon points="608.9,130.0 598.5,136.0 598.5,129.0 608.9,123.0" fill="#EA857E"/><polygon points="598.5,117.0 608.9,123.0 598.5,129.0 588.1,123.0" fill="#F9C4C0"/></g><g><polygon points="617.5,157.0 634.8,167.0 634.8,161.0 617.5,151.0" fill="#ECEAF3"/><polygon points="652.2,157.0 634.8,167.0 634.8,161.0 652.2,151.0" fill="#DDDAE8"/><polygon points="634.8,141.0 652.2,151.0 634.8,161.0 617.5,151.0" fill="#FFFFFF"/></g><g class="press" style="animation-delay:3s"><polygon points="624.4,151.0 634.8,157.0 634.8,150.0 624.4,144.0" fill="#B0E2AE"/><polygon points="645.2,151.0 634.8,157.0 634.8,150.0 645.2,144.0" fill="#93D391"/><polygon points="634.8,138.0 645.2,144.0 634.8,150.0 624.4,144.0" fill="#D2EFD0"/></g></g><rect x="800" y="26" width="360" height="278" rx="22" fill="#fff" opacity=".7"/><circle cx="834" cy="228" r="15" fill="#5B5878"/><text x="834" y="233.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="860" y="234" font-size="21" font-weight="700" fill="#3E3A4F">watch the spin</text><text x="822" y="264" font-size="13.5" fill="#8B87A3">three leds race, slow down and stop. black or red</text><text x="822" y="283" font-size="13.5" fill="#8B87A3">pays 2x, green is rare and pays 9x.</text><g filter="url(#soft)"><polygon points="980.0,70.0 1109.9,145.0 997.3,210.0 867.4,135.0" fill="#ECE7FA" /><g><polygon points="935.0,118.0 948.8,126.0 948.8,116.0 935.0,108.0" fill="#A9B4C9"/><polygon points="962.7,118.0 948.8,126.0 948.8,116.0 962.7,108.0" fill="#8D9AB4"/><polygon points="948.8,100.0 962.7,108.0 948.8,116.0 935.0,108.0" fill="#C9D1E0"/></g><circle cx="948.8" cy="105.0" r="15" fill="#8D9AB4" filter="url(#blur)" class="spin0"/><circle cx="948.8" cy="105.0" r="7.5" fill="#8D9AB4"/><circle cx="946.3" cy="102.5" r="2.2" fill="#fff" opacity=".8"/><g><polygon points="969.6,138.0 983.5,146.0 983.5,136.0 969.6,128.0" fill="#A9B4C9"/><polygon points="997.3,138.0 983.5,146.0 983.5,136.0 997.3,128.0" fill="#8D9AB4"/><polygon points="983.5,120.0 997.3,128.0 983.5,136.0 969.6,128.0" fill="#C9D1E0"/></g><circle cx="983.5" cy="125.0" r="15" fill="#EA857E" filter="url(#blur)" class="spin1"/><circle cx="983.5" cy="125.0" r="7.5" fill="#EA857E"/><circle cx="981.0" cy="122.5" r="2.2" fill="#fff" opacity=".8"/><g><polygon points="1004.2,158.0 1018.1,166.0 1018.1,156.0 1004.2,148.0" fill="#A9B4C9"/><polygon points="1032.0,158.0 1018.1,166.0 1018.1,156.0 1032.0,148.0" fill="#8D9AB4"/><polygon points="1018.1,140.0 1032.0,148.0 1018.1,156.0 1004.2,148.0" fill="#C9D1E0"/></g><circle cx="1018.1" cy="145.0" r="15" fill="#93D391" filter="url(#blur)" class="spin2"/><circle cx="1018.1" cy="145.0" r="7.5" fill="#93D391"/><circle cx="1015.6" cy="142.5" r="2.2" fill="#fff" opacity=".8"/><circle cx="1018.1" cy="145.0" r="22" fill="none" stroke="#93D391" stroke-width="3" class="win"/></g>
</svg>
